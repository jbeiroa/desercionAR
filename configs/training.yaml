# File: configs/training.yaml

# Path to the training data. The '~' will be expanded to your home directory.
train_data_path: "~/Code/data/desercionAR/train.csv"

# Lists of column types. This is crucial for the ColumnTransformer.
features:
  numeric:
    - "CH06" # Age
    # Add any other numeric features here
  categorical:
    - "CH04" # Sex
    - "NIVEL_ED"
    # Add any other categorical features here
  target: "DESERTO"

# Preprocessing steps to be applied. The keys are for the pipeline steps,
# and the values are looked up in the PREPROCESSOR_REGISTRY in trainer.py.
preprocessors:
  numeric_imputer: "make_imputer"
  scaler: "make_scaler"
  categorical_imputer: "make_imputer" # Can use the same imputer for different strategies
  encoder: "make_encoder"

# Grid search configuration for models
models:
  - type: "logistic_regression"
    base_params:
      random_state: 42
      solver: "liblinear"
    hyperparams:
      C:
        type: "logspace"
        start: -3
        stop: 3
        num: 4
      penalty: ["l1", "l2"]

  - type: "decision_tree"
    base_params:
      random_state: 42
    hyperparams:
      max_depth: [3, 5, 10]
      min_samples_leaf: [10, 20, 50]

  - type: "bagging"
    base_params:
      random_state: 42
      # This defines the nested model. The logic will recursively build it.
      estimator:
        type: "decision_tree"
        base_params:
          random_state: 42
          max_depth: 5 # A fixed depth for the base estimator
    hyperparams:
      n_estimators: [10, 50, 100]

# Configuration for the GridSearchCV process
training:
  cv_folds: 3 # Using 3 for speed, can be increased to 5 or 10
  scoring: "f1_macro"
