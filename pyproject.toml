[tool.poetry]
name = "desercionAR"
version = "0.1.1"
description = ""
authors = ["jbeiroa <jbeiroa@gmail.com>"]
readme = "README.md"
package-mode = false

packages = [
    { include = "api", from = "src" },
    { include = "cli", from = "src" },
    { include = "dashboard", from = "src" },
    { include = "data", from = "src" },
    { include = "features", from = "src" },
    { include = "interpret", from = "src" },
    { include = "models", from = "src" },
    { include = "pipelines", from = "src" },
]


[tool.poetry.dependencies]
python = "^3.11"
matplotlib = "^3.8.2"
pyeph = "^1.2.0"
seaborn = "^0.13.2"
dash = "^2.14.2"
jupyter = "^1.0.0"
scikit-learn = "^1.4.0"
numpy = "^1.26.3"
pandas = "^2.0"
typer = "^0.12.3"
imbalanced-learn = "^0.12.0"
catboost = "^1.2.3"
dash-bootstrap-components = "^1.5.0"
gunicorn = "^21.2.0"
pyyaml = "^6.0.1"
pylint = "^4.0.4"
types-requests = "^2.32.4.20260107"
pandas-stubs = "^2.3.3.260113"
black = "^24.4.2"
mlflow = "^3.8.1"
fastapi = "^0.111.1"
uvicorn = "^0.30.3"
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-mock (>=3.15.1,<4.0.0)"
]
